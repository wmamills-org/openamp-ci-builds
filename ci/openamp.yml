header:
  version: 9

build_system: oe
distro: poky

defaults:
  repos:
    refspec: master

repos:
  layers/poky:
    url: https://git.yoctoproject.org/git/poky
    # yocto-5.2 is the same as commit 9b96fdbb0cab02f4a6180e812b02bc9d4c41b1a5
    refspec: yocto-5.2
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
  layers/meta-openamp:
    #url: https://github.com/openamp/meta-openamp.git
    #refspec: master
    url: https://github.com/wmamills/meta-openamp.git
    refspec: wam-update-layer-conf
    layers:
      .:

env:
  BB_LOGCONFIG: ""
  TOOLCHAIN_DIR: ""

local_conf_header:
  base: |
    CONF_VERSION = "2"
    BB_GENERATE_MIRROR_TARBALLS = "1"
    BB_GIT_SHALLOW = "1"
    BB_GIT_SHALLOW_DEPTH = "1"
    PACKAGE_CLASSES = "package_ipk"
    PACKAGECONFIG:remove:pn-qemu-system-native = "gtk+ sdl"
    USER_CLASSES ?= "buildstats"
    IMAGE_FSTYPES:append = " cpio.gz"
    IMAGE_FSTYPES:remove = "jffs2"
  extra-packages: |
    PACKAGE_INSTALL_EXTRAS = "rsync iproute2 dropbear kernel-modules"
    IMAGE_INSTALL:append = " ${PACKAGE_INSTALL_EXTRAS} "
    EXTRA_IMAGE_FEATURES:append = " allow-empty-password allow-root-login empty-root-password ssh-server-dropbear"
  kernel-selection:
    PREFERRED_PROVIDER_virtual/kernel = "linux-openamp"

  openamp: |
    DISTRO_FEATURES:append = " openamp"
  noptest: |
    DISTRO_FEATURES:remove = "ptest"

machine: unset
