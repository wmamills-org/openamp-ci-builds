# genericarm64 w/ linux yocto 
# no autorev by default
# no meta-openamp-bsp
# build openamp-image-minimal

header:
  version: 9
  includes:
    - openamp.yml

machine: genericarm64

local_conf_header:
  machine: |
    # nothing needed
  kernel-selection: |
    PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
  bugs: |
    # Only ping until errors can be resolved
    TEST_SUITES = "ping"

target:
  - openamp-image-minimal
